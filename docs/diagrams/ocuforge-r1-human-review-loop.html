<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OcuForge R1 human review loop</title>
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Segoe UI,Arial,sans-serif; }
    main { max-width:1260px; margin:auto; padding:26px 30px 34px; }
    .eyebrow { color:var(--muted); font:600 12px Consolas,monospace; letter-spacing:.14em; }
    h1 { margin:10px 0 5px; font:400 34px Georgia,serif; }
    p { max-width:850px; margin:0 0 20px; color:var(--muted); font-size:15px; line-height:1.5; }
    svg { display:block; width:100%; height:auto; }
    @media print { body { background:#fff; } main { padding:0; } }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">OCUFORGE / R1 EXECUTION</div>
  <h1>One candidate. One stop. One accountable decision.</h1>
  <p>R1 is an evidence loop, not a leaderboard. A model is not promoted automatically and there is no current champion.</p>
  <svg viewBox="0 0 1200 650" role="img" aria-labelledby="loop-title loop-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="loop-title">OcuForge R1 human in the loop experiment workflow</title>
    <desc id="loop-desc">The operator selects C0, C1, or C2, runs one candidate, stops, and brings metrics, errors, cost, and provenance to owner review. Review either advances to the next candidate or records a winner/finalist for the planned CE versus CORN ablation.</desc>
    <defs>
      <marker id="loop-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#4f5d75"/></marker>
      <marker id="loop-accent-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#eb6c36"/></marker>
      <style>
        .kicker { font:600 11px Consolas,monospace; letter-spacing:1.7px; fill:#4f5d75; }
        .title { font:600 17px Segoe UI,Arial,sans-serif; fill:#2d3142; }
        .body { font:400 13px Segoe UI,Arial,sans-serif; fill:#4f5d75; }
        .mono { font:500 11px Consolas,monospace; fill:#4f5d75; }
        .box { fill:#fbfbfa; stroke:#2d3142; stroke-width:1.4; }
        .focal { fill:#fbe7dc; stroke:#eb6c36; stroke-width:1.8; }
        .optional { fill:#f5f5f5; stroke:#9aa3b5; stroke-width:1.2; stroke-dasharray:6 5; }
        .connector { fill:none; stroke:#4f5d75; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#loop-arrow); }
        .connector-accent { fill:none; stroke:#eb6c36; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#loop-accent-arrow); }
      </style>
    </defs>
    <rect width="1200" height="650" fill="#f5f5f5"/>
    <text x="50" y="50" class="kicker">THREE CANDIDATES / CONTROLLED BENCHMARK</text>
    <path class="connector-accent" d="M220 270 H280"/><path class="connector-accent" d="M450 270 H510"/><path class="connector" d="M680 270 H740"/><path class="connector" d="M910 270 H950"/>
    <path class="connector" d="M1010 330 V420 H860"/><path class="connector-accent" d="M1070 330 V420 H1000"/>
    <path class="connector" d="M700 463 H180 Q160 463 160 445 V330"/>

    <g transform="translate(50 210)"><rect width="170" height="120" rx="8" class="box"/><text x="18" y="25" class="kicker">STEP 01</text><text x="18" y="53" class="title">Select candidate</text><text x="18" y="79" class="body">C0 - ConvNeXt</text><text x="18" y="97" class="body">C1 - FLAIR</text><text x="18" y="115" class="body">C2 - DINOv3 MIL</text></g>
    <g transform="translate(280 210)"><rect width="170" height="120" rx="8" class="focal"/><text x="18" y="25" class="kicker">STEP 02</text><text x="18" y="53" class="title">Run one</text><text x="18" y="79" class="body">CE objective</text><text x="18" y="97" class="body">authorized assets</text><text x="18" y="115" class="body">identity-safe split</text></g>
    <g transform="translate(510 210)"><rect width="170" height="120" rx="8" class="focal"/><text x="18" y="25" class="kicker">STOP</text><text x="18" y="53" class="title">Do not chain</text><text x="18" y="79" class="body">capture artifacts</text><text x="18" y="97" class="body">record status</text><text x="18" y="115" class="body">wait for review</text></g>
    <g transform="translate(740 210)"><rect width="170" height="120" rx="8" class="box"/><text x="18" y="25" class="kicker">STEP 03</text><text x="18" y="53" class="title">Inspect evidence</text><text x="18" y="79" class="body">QWK + companions</text><text x="18" y="97" class="body">errors + calibration</text><text x="18" y="115" class="body">cost + provenance</text></g>
    <polygon points="1010,210 1070,270 1010,330 950,270" class="box"/><text x="1010" y="265" text-anchor="middle" class="kicker">OWNER</text><text x="1010" y="283" text-anchor="middle" class="title" font-size="14">decision</text>
    <g transform="translate(700 420)"><rect width="160" height="86" rx="8" class="box"/><text x="18" y="25" class="kicker">CONTINUE</text><text x="18" y="53" class="title">Next candidate</text><text x="18" y="74" class="body">review then run</text></g>
    <g transform="translate(1000 420)"><rect width="160" height="86" rx="8" class="optional"/><text x="18" y="25" class="kicker">ADVANCE</text><text x="18" y="53" class="title">Winner / finalist</text><text x="18" y="74" class="body">evidence supports it</text></g>
    <g transform="translate(390 560)"><rect width="420" height="58" rx="8" class="optional"/><text x="20" y="25" class="kicker">ONLY AFTER SELECTION</text><text x="20" y="47" class="title" font-size="14">winner + CE  vs  winner + CORN</text></g>
    <text x="50" y="590" class="mono">CURRENT R1 CHAMPION: NONE</text>
  </svg>
</main>
</body>
</html>
