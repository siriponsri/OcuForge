<svg viewBox="0 0 1200 620" role="img" aria-labelledby="roadmap-title roadmap-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="roadmap-title">OcuForge R0 to R8 roadmap</title>
  <desc id="roadmap-desc">The roadmap moves from R0 evidence freeze to R1 global benchmark, then through ROI, labeling, GUI integration, DICOM, drift monitoring, and HL7 FHIR mapping. R0 and R1 are the current gates.</desc>
  <defs>
    <marker id="roadmap-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#4f5d75"/></marker>
    <style>
      .kicker { font:600 11px Consolas,monospace; letter-spacing:1.7px; fill:#4f5d75; }
      .title { font:600 16px Segoe UI,Arial,sans-serif; fill:#2d3142; }
      .body { font:400 12px Segoe UI,Arial,sans-serif; fill:#4f5d75; }
      .mono { font:500 11px Consolas,monospace; fill:#4f5d75; }
      .phase { fill:#fbfbfa; stroke:#2d3142; stroke-width:1.4; }
      .current { fill:#fbe7dc; stroke:#eb6c36; stroke-width:1.8; }
      .later { fill:#f5f5f5; stroke:#9aa3b5; stroke-width:1.2; stroke-dasharray:6 5; }
      .connector { fill:none; stroke:#4f5d75; stroke-width:2; stroke-linecap:round; marker-end:url(#roadmap-arrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f5f5f5"/>
  <text x="50" y="52" class="kicker">ORDER IS A CONTROL</text>
  <text x="50" y="84" font-family="Georgia,serif" font-style="italic" font-size="17" fill="#2d3142">Every candidate run ends in a human review stop.</text>
  <path class="connector" d="M150 251 H164"/><path class="connector" d="M274 251 H288"/><path class="connector" d="M398 251 H412"/><path class="connector" d="M522 251 H536"/><path class="connector" d="M646 251 H660"/><path class="connector" d="M770 251 H784"/><path class="connector" d="M894 251 H908"/><path class="connector" d="M1018 251 H1032"/>
  <g transform="translate(40 170)"><rect width="110" height="162" rx="8" class="current"/><text x="16" y="25" class="kicker">R0</text><text x="16" y="57" class="title">Freeze</text><text x="16" y="83" class="body">data</text><text x="16" y="101" class="body">supervision</text><text x="16" y="119" class="body">splits</text><text x="16" y="137" class="body">licenses</text></g>
  <g transform="translate(164 170)"><rect width="110" height="162" rx="8" class="current"/><text x="16" y="25" class="kicker">R1</text><text x="16" y="57" class="title">Compare</text><text x="16" y="83" class="body">C0 / C1 / C2</text><text x="16" y="101" class="body">CE first</text><text x="16" y="119" class="body">metrics</text><text x="16" y="137" class="body">cost + errors</text></g>
  <g transform="translate(288 170)"><rect width="110" height="162" rx="8" class="phase"/><text x="16" y="25" class="kicker">R2</text><text x="16" y="57" class="title">Prepare</text><text x="16" y="83" class="body">identity-safe</text><text x="16" y="101" class="body">ROI geometry</text><text x="16" y="119" class="body">provenance</text></g>
  <g transform="translate(412 170)"><rect width="110" height="162" rx="8" class="phase"/><text x="16" y="25" class="kicker">R3</text><text x="16" y="57" class="title">Classify</text><text x="16" y="83" class="body">supported</text><text x="16" y="101" class="body">lesions</text><text x="16" y="119" class="body">separate</text><text x="16" y="137" class="body">model track</text></g>
  <g transform="translate(536 170)"><rect width="110" height="162" rx="8" class="phase"/><text x="16" y="25" class="kicker">R4</text><text x="16" y="57" class="title">QA / HITL</text><text x="16" y="83" class="body">suggest</text><text x="16" y="101" class="body">confirm</text><text x="16" y="119" class="body">correct</text><text x="16" y="137" class="body">escalate</text></g>
  <g transform="translate(660 170)"><rect width="110" height="162" rx="8" class="phase"/><text x="16" y="25" class="kicker">R5</text><text x="16" y="57" class="title">Integrate</text><text x="16" y="83" class="body">templates/</text><text x="16" y="101" class="body">contracts</text><text x="16" y="119" class="body">reviewable</text><text x="16" y="137" class="body">workflow</text></g>
  <g transform="translate(784 170)"><rect width="110" height="162" rx="8" class="later"/><text x="16" y="25" class="kicker">R6</text><text x="16" y="57" class="title">DICOM</text><text x="16" y="83" class="body">after model</text><text x="16" y="101" class="body">+ GUI</text><text x="16" y="119" class="body">stability</text></g>
  <g transform="translate(908 170)"><rect width="110" height="162" rx="8" class="later"/><text x="16" y="25" class="kicker">R7</text><text x="16" y="57" class="title">Diff / drift</text><text x="16" y="83" class="body">inputs</text><text x="16" y="101" class="body">features</text><text x="16" y="119" class="body">calibration</text></g>
  <g transform="translate(1032 170)"><rect width="110" height="162" rx="8" class="later"/><text x="16" y="25" class="kicker">R8</text><text x="16" y="57" class="title">HL7 / FHIR</text><text x="16" y="83" class="body">mapping</text><text x="16" y="101" class="body">demo only</text><text x="16" y="119" class="body">no HIS claim</text></g>
  <g transform="translate(50 420)"><rect width="1100" height="108" rx="8" fill="#eef0f3" stroke="#d9dbe1"/><text x="24" y="28" class="kicker">GOVERNANCE THREAD</text><text x="24" y="62" class="title">R0: no large download or training</text><text x="380" y="62" class="title">R1: one candidate at a time</text><text x="750" y="62" class="title">R6-R8: later integrations</text><text x="24" y="86" class="body">Owner review is the gate between stages; no automatic champion promotion.</text></g>
  <text x="50" y="576" class="mono">CURRENT: R0_V3 PASS - R1_P0 READY_NOT_EXECUTED - R1 READY_NOT_EXECUTED - CHAMPION: NONE</text>
</svg>
