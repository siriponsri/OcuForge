[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "eyes-detected-labeler"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["eyes-detected-contracts==0.1.0", "numpy==2.3.5", "Pillow==12.3.0", "pymongo==4.13.2"]
[project.scripts]
eyes-local = "labeler_bridge.local_cli:main"
eyes-labeler = "labeler_bridge.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
